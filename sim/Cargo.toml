[package]
name = "phi-lock-hil-server"
version = "0.1.0"
edition = "2021"
description = "QCAL-cQED-v1 gRPC HIL Server — transmisión S21 en vivo"

[[bin]]
name = "hil-server"
path = "src/hil_server.rs"

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"

[build-dependencies]
tonic-build = "0.12"
